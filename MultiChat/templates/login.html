<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIIT Kottayam Admission Chatbot - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --soft-cream: #F5E2C5;
            --amber-gold: #D89B37;
            --ice-blue: #EEF2F6;
            --midnight-navy: #2B2E5C;
            --text-dark: #1E203B;
            --text-muted: #6C727F;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--ice-blue);
            padding: 20px;
        }

        /* Main Outer Container */
        .container {
            background-color: var(--white);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(43, 46, 92, 0.08);
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border-bottom: 6px solid var(--midnight-navy);
        }

        /* Top Palette Banner */
        .top-banner {
            background-color: var(--soft-cream);
            height: 28px;
            width: 100%;
            border-bottom: 3px solid var(--amber-gold);
        }

        /* Content Layout */
        .content-body {
            display: flex;
            padding: 45px;
            gap: 30px;
            align-items: center;
        }

        /* Form Side */
        .login-card {
            flex: 1;
            background: var(--white);
            padding: 10px;
            max-width: 400px;
        }

        .login-card h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--midnight-navy);
            margin-bottom: 6px;
        }

        .signup-text {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .signup-text a {
            color: var(--amber-gold);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--midnight-navy);
            display: block;
        }

        .forgot-link {
            font-size: 12px;
            color: var(--amber-gold);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #D1D5DB;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            color: var(--text-dark);
            background-color: #FAFAFC;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--midnight-navy);
            background-color: var(--white);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 28px;
        }

        .remember-me input {
            accent-color: var(--midnight-navy);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .remember-me label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--midnight-navy);
            border: none;
            border-radius: 8px;
            color: var(--white);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-login:hover {
            background-color: #1E203B;
            transform: translateY(-1px);
        }

        /* Illustration Side */
        .illustration-container {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            background-color: #F8FAFC;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
        }

        .illustration-svg {
            width: 100%;
            max-width: 400px;
            height: auto;
        }

        .project-tagline {
            text-align: center;
            margin-top: 20px;
        }

        .project-tagline h3 {
            font-size: 18px;
            color: var(--midnight-navy);
            font-weight: 700;
        }

        .project-tagline p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Responsive Design */
        @media (max-width: 850px) {
            .content-body {
                flex-direction: column;
                padding: 25px;
            }

            .login-card {
                max-width: 100%;
            }

            .illustration-container {
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Sand & Gold Stripe -->
        <div class="top-banner"></div>

        <div class="content-body">
            <!-- Left Side: Login Form -->
            <div class="login-card">
                <h2>Login</h2>
                <p class="signup-text">Doesn't have an account yet? <a href="#">Sign Up</a></p>

                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="username">Username or Email Address</label>
                        <input type="text" id="username" name="username" placeholder="you@example.com or username" required>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>
                        <input type="password" id="password" name="password" placeholder="Enter 6 characters or more" required>
                    </div>

                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>

                    <button type="submit" class="btn-login">LOGIN</button>
                </form>
            </div>

            <!-- Right Side: New Mobile Voice AI Assistant Illustration -->
            <div class="illustration-container">
                <svg class="illustration-svg" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Base Shadow -->
                    <ellipse cx="250" cy="330" rx="160" ry="18" fill="#E2E8F0"/>

                    <!-- Central Smartphone Device -->
                    <rect x="180" y="70" width="140" height="240" rx="20" fill="#2B2E5C"/>
                    <rect x="188" y="82" width="124" height="216" rx="14" fill="#FFFFFF"/>
                    <!-- Speaker notch -->
                    <rect x="230" y="76" width="40" height="4" rx="2" fill="#1E203B"/>

                    <!-- Phone Screen Content (Voice Chat Interface) -->
                    <!-- Bot Speech Bubble inside Phone -->
                    <rect x="198" y="105" width="90" height="32" rx="8" fill="#EEF2F6"/>
                    <text x="208" y="125" fill="#2B2E5C" font-size="10" font-weight="600">Hello! Ask me...</text>

                    <!-- Waveform Bars inside Phone -->
                    <rect x="210" y="160" width="6" height="18" rx="3" fill="#D89B37"/>
                    <rect x="222" y="152" width="6" height="34" rx="3" fill="#2B2E5C"/>
                    <rect x="234" y="145" width="6" height="48" rx="3" fill="#D89B37"/>
                    <rect x="246" y="155" width="6" height="28" rx="3" fill="#2B2E5C"/>
                    <rect x="258" y="148" width="6" height="42" rx="3" fill="#D89B37"/>
                    <rect x="270" y="162" width="6" height="14" rx="3" fill="#2B2E5C"/>

                    <!-- Mic Action Button on Phone Screen -->
                    <circle cx="250" cy="245" r="22" fill="#D89B37"/>
                    <!-- Mic Icon -->
                    <rect x="246" y="235" width="8" height="14" rx="4" fill="#FFFFFF"/>
                    <path d="M241 243 C241 252 259 252 259 243" stroke="#FFFFFF" stroke-width="2" fill="none"/>
                    <line x1="250" y1="252" x2="250" y2="257" stroke="#FFFFFF" stroke-width="2"/>

                    <!-- Floating Academic & Voice Elements -->

                    <!-- Floating Graduation Cap Badge (Top Right) -->
                    <g transform="translate(340, 50)">
                        <circle cx="35" cy="35" r="32" fill="#F5E2C5"/>
                        <!-- Cap Shape -->
                        <polygon points="35,18 55,27 35,36 15,27" fill="#2B2E5C"/>
                        <rect x="25" y="32" width="20" height="10" rx="3" fill="#2B2E5C"/>
                        <path d="M50 28 L50 42" stroke="#D89B37" stroke-width="2"/>
                        <circle cx="50" cy="43" r="2" fill="#D89B37"/>
                    </g>

                    <!-- Floating Audio Waves Badge (Top Left) -->
                    <g transform="translate(50, 80)">
                        <rect width="90" height="45" rx="10" fill="#2B2E5C"/>
                        <text x="45" y="20" fill="#F5E2C5" font-size="9" font-weight="600" text-anchor="middle">VOICE AI</text>
                        <path d="M20 32 Q25 24 30 32 T40 32 T50 32 T60 32 T70 32" stroke="#D89B37" stroke-width="2" fill="none"/>
                    </g>

                    <!-- Floating Multilingual Speech Bubble (Bottom Left) -->
                    <g transform="translate(60, 210)">
                        <path d="M0 10 C0 4.4 4.4 0 10 0 L100 0 C105.6 0 110 4.4 110 10 L110 40 C110 45.6 105.6 50 100 50 L20 50 L5 62 L10 45 C4 42 0 36 0 30 Z" fill="#F5E2C5"/>
                        <text x="55" y="24" fill="#2B2E5C" font-size="10" font-weight="700" text-anchor="middle">Admissions</text>
                        <text x="55" y="38" fill="#D89B37" font-size="9" font-weight="600" text-anchor="middle">മലയാളം • हिंदी • EN</text>
                    </g>

                    <!-- Verified Shield Badge (Bottom Right) -->
                    <g transform="translate(350, 210)">
                        <rect width="80" height="48" rx="10" fill="#EEF2F6" stroke="#2B2E5C" stroke-width="1.5"/>
                        <circle cx="25" cy="24" r="12" fill="#D89B37"/>
                        <!-- Checkmark -->
                        <path d="M20 24 L23 27 L30 20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                        <text x="58" y="22" fill="#2B2E5C" font-size="9" font-weight="700" text-anchor="middle">Official</text>
                        <text x="58" y="34" fill="#6C727F" font-size="8" font-weight="500" text-anchor="middle">RAG AI</text>
                    </g>
                </svg>

                <div class="project-tagline">
                    <h3>IIIT Kottayam Admissions</h3>
                    <p>Multilingual & Voice-Enabled AI Assistant</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
