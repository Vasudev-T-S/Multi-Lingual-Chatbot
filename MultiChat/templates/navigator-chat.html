<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C9962E;
    --brown:#4A2E22;
    --navy-deep:#242450;
    --danger:#C1462F;
    --radius-pill:999px;

    /* light theme surfaces */
    --header-bg:#F3E0BE;
    --panel-bg:#EEF1F3;
    --composer-bg:#2E2E63;
    --bot-bubble:#F6E7C9;
    --bot-bubble-border:#E3C58C;
    --user-bubble:#D9E8F5;
    --user-bubble-border:#C9962E;
    --text-primary:#242450;
    --text-muted:#4A2E22;
    --input-bg:#FFFFFF;
    --input-text:#242450;
    --input-placeholder:#9a9a9a;
    --menu-bg:#FFFFFF;
    --page-bg:#DCE4EA;
    --mic-idle-bg:rgba(255,255,255,0.12);
    --mic-idle-border:rgba(255,255,255,0.3);
    --mic-idle-fg:#FFFFFF;
    --shadow:0 16px 48px rgba(46,46,99,0.22);

    --sidebar-bg:#F7EFDD;
    --sidebar-border:rgba(74,46,34,0.12);
    --sidebar-text:#2E2E63;
    --sidebar-text-muted:rgba(46,46,99,0.6);
    --sidebar-item-hover:rgba(201,150,46,0.14);
    --sidebar-item-active:rgba(201,150,46,0.24);
  }

  [data-theme="dark"]{
    --header-bg:#241C30;
    --panel-bg:#1B1626;
    --composer-bg:#14101C;
    --bot-bubble:#3A2E1C;
    --bot-bubble-border:#6B4E28;
    --user-bubble:#1F3A52;
    --user-bubble-border:#C9962E;
    --text-primary:#F1EAD9;
    --text-muted:#D8C9A8;
    --input-bg:#2A2438;
    --input-text:#F1EAD9;
    --input-placeholder:#8b8496;
    --menu-bg:#241C30;
    --page-bg:#0F0C16;
    --mic-idle-bg:rgba(255,255,255,0.08);
    --mic-idle-border:rgba(255,255,255,0.22);
    --mic-idle-fg:#F1EAD9;
    --shadow:0 16px 48px rgba(0,0,0,0.5);

    --sidebar-bg:#1A1420;
    --sidebar-border:rgba(255,255,255,0.08);
    --sidebar-text:#F1EAD9;
    --sidebar-text-muted:rgba(241,234,217,0.55);
    --sidebar-item-hover:rgba(201,150,46,0.14);
    --sidebar-item-active:rgba(201,150,46,0.22);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    font-family:'Work Sans', sans-serif;
    height:100%;
    background:var(--page-bg);
    transition:background 0.25s ease;
    overflow:hidden;
  }

  .layout{
    display:flex;
    height:100vh;
    height:100dvh;
    width:100vw;
    position:relative;
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:var(--sidebar-width, 272px);
    flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:1px solid var(--sidebar-border);
    display:flex;
    flex-direction:column;
    transition:transform 0.2s ease;
    overflow:hidden;
    position:relative;
  }
  .sidebar.resizing{ transition:none; }
  .sidebar.collapsed{ width:0; }

  .sidebar-resize-handle{
    position:absolute;
    top:0; bottom:0; right:0;
    width:6px;
    cursor:col-resize;
    z-index:5;
    background:transparent;
  }
  .sidebar-resize-handle:hover,
  .sidebar-resize-handle.dragging{
    background:var(--gold);
    opacity:0.5;
  }
  .sidebar.collapsed .sidebar-resize-handle{ display:none; }
  @media (max-width:768px){
    .sidebar-resize-handle{ display:none; }
  }

  .sidebar-top{
    padding:16px 14px 12px;
    flex-shrink:0;
  }
  .sidebar-brand{
    display:flex;
    align-items:center;
    gap:9px;
    padding:4px 6px 16px;
  }
  .sidebar-brand .bot-avatar{
    width:28px; height:28px; font-size:13px;
  }
  .sidebar-brand-name{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--sidebar-text);
    white-space:nowrap;
  }

  .new-chat-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:9px;
    padding:10px 13px;
    border-radius:12px;
    border:1.5px solid var(--gold);
    background:transparent;
    color:var(--sidebar-text);
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .new-chat-btn:hover{ background:var(--sidebar-item-hover); }
  .new-chat-btn svg{ width:16px; height:16px; flex-shrink:0; color:var(--gold); }

  .sidebar-section-label{
    padding:16px 20px 6px;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--sidebar-text-muted);
    flex-shrink:0;
  }

  .chat-list{
    flex:1;
    overflow-y:auto;
    padding:0 10px 10px;
  }
  .chat-item{
    display:flex;
    flex-direction:column;
    gap:1px;
    padding:9px 11px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:2px;
  }
  .chat-item:hover{ background:var(--sidebar-item-hover); }
  .chat-item.active{ background:var(--sidebar-item-active); }
  .chat-item-title{
    font-size:13px;
    font-weight:500;
    color:var(--sidebar-text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chat-item-preview{
    font-size:11.5px;
    color:var(--sidebar-text-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .sidebar-empty{
    padding:14px 20px;
    font-size:12px;
    color:var(--sidebar-text-muted);
    line-height:1.5;
  }

  /* mobile overlay behavior */
  .sidebar-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    z-index:29;
  }

  /* ---------- main pane ---------- */
  .main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:var(--panel-bg);
  }

  .header{
    background:var(--header-bg);
    padding:14px 20px 13px;
    border-bottom:3px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-shrink:0;
    transition:background 0.25s ease;
  }
  .header-left{ display:flex; align-items:center; gap:10px; min-width:0; }

  .sidebar-toggle{
    width:34px; height:34px;
    border-radius:8px;
    border:none;
    background:transparent;
    color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .sidebar-toggle:hover{ background:rgba(74,46,34,0.1); }
  .sidebar-toggle svg{ width:19px; height:19px; }

  .bot-id{ display:flex; align-items:center; gap:10px; min-width:0; }
  .bot-avatar{
    width:36px; height:36px;
    border-radius:50%;
    background:var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'Poppins', sans-serif;
    font-weight:600; font-size:15px;
    color:var(--navy-deep);
    flex-shrink:0;
  }
  .bot-name{ font-family:'Poppins', sans-serif; font-weight:600; font-size:16px; color:var(--text-muted); }
  .bot-status{ font-size:11px; color:var(--text-muted); opacity:0.75; margin-top:1px; display:flex; align-items:center; gap:5px; }
  .status-dot{ width:6px; height:6px; border-radius:50%; background:#4C8A5E; display:inline-block; flex-shrink:0; }

  .header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }

  .theme-btn{
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid rgba(74,46,34,0.15);
    background:var(--input-bg);
    color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .theme-btn svg{ width:17px; height:17px; }
  .theme-btn:hover{ background:var(--user-bubble); }

  .lang-switch{ position:relative; }
  .lang-btn{
    font-family:'Work Sans', sans-serif;
    font-size:12px; font-weight:600;
    background:var(--input-bg); color:var(--text-primary);
    border:1px solid rgba(74,46,34,0.15);
    padding:7px 12px;
    border-radius:var(--radius-pill);
    cursor:pointer;
    display:flex; align-items:center; gap:5px;
    white-space:nowrap;
  }
  .lang-btn:hover{ background:var(--user-bubble); }
  .lang-menu{
    position:absolute; top:calc(100% + 8px); right:0;
    background:var(--menu-bg);
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    min-width:150px;
    display:none;
    z-index:20;
    overflow:hidden;
    padding:4px;
  }
  .lang-menu.open{ display:block; }
  .lang-option{
    padding:9px 12px; font-size:13px; font-weight:500;
    cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    color:var(--text-primary);
    border-radius:10px;
  }
  .lang-option:hover{ background:var(--user-bubble); }
  .lang-option.active{ background:var(--bot-bubble); color:var(--gold); }
  .lang-option small{ color:#8b8b8b; font-weight:400; font-size:11px; }

  .thread-wrap{
    flex:1;
    overflow-y:auto;
    padding:22px 24px 10px;
    background:var(--panel-bg);
    transition:background 0.25s ease;
    width:100%;
  }

  .row{ display:flex; margin-bottom:10px; }
  .row.left{ justify-content:flex-start; }
  .row.right{ justify-content:flex-end; }

  .bubble{
    font-size:14.5px;
    font-weight:500;
    line-height:1.45;
    padding:11px 17px;
    border-radius:20px;
    max-width:min(78%, 480px);
  }
  .bubble-bot{
    background:var(--bot-bubble);
    border:1.5px solid var(--bot-bubble-border);
    color:var(--text-primary);
    border-bottom-left-radius:6px;
  }
  .bubble-user{
    background:var(--user-bubble);
    border:1.5px solid var(--user-bubble-border);
    color:var(--text-primary);
    border-bottom-right-radius:6px;
  }

  .composer{
    padding:14px 24px 18px;
    background:var(--composer-bg);
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
    transition:background 0.25s ease;
    width:100%;
  }
  .composer-input{
    flex:1;
    background:var(--input-bg);
    border:none;
    border-radius:var(--radius-pill);
    padding:12px 18px;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--input-text);
    min-width:0;
  }
  .composer-input::placeholder{ color:var(--input-placeholder); }
  .composer-input:focus{ outline:2px solid var(--gold); outline-offset:2px; }

  .icon-btn{
    width:42px; height:42px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn svg{ width:19px; height:19px; }

  .mic-btn{
    background:var(--mic-idle-bg);
    color:var(--mic-idle-fg);
    border:1.5px solid var(--mic-idle-border);
  }
  .mic-btn:hover{ background:rgba(255,255,255,0.2); }
  .mic-btn.listening{
    background:var(--danger);
    border-color:var(--danger);
    color:#fff;
    animation:pulse 1.1s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(193,70,47,0.5); }
    70%{ box-shadow:0 0 0 10px rgba(193,70,47,0); }
    100%{ box-shadow:0 0 0 0 rgba(193,70,47,0); }
  }
  .send-btn{
    background:var(--gold);
    color:var(--navy-deep);
  }
  .send-btn:hover{ filter:brightness(1.08); }

  .icon-btn:focus-visible, .composer-input:focus-visible, .lang-btn:focus-visible, .theme-btn:focus-visible, .new-chat-btn:focus-visible, .sidebar-toggle:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    .mic-btn.listening{ animation:none; }
    *{ transition:none !important; }
  }

  /* ---------- mobile ---------- */
  @media (max-width:768px){
    .sidebar{
      position:fixed;
      top:0; bottom:0; left:0;
      z-index:30;
      width:82vw;
      max-width:300px;
      transform:translateX(-100%);
      box-shadow:0 0 40px rgba(0,0,0,0.3);
    }
    .sidebar.mobile-open{ transform:translateX(0); }
    .sidebar.collapsed{ width:82vw; max-width:300px; }
    .sidebar-backdrop.show{ display:block; }
    .bot-status{ display:none; }
  }
</style>
</head>
<body>

<div class="layout">

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <div class="bot-avatar">N</div>
        <span class="sidebar-brand-name">Navigator</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span data-i18n="newChat">New chat</span>
      </button>
    </div>
    <div class="sidebar-section-label" data-i18n="recents">Recent</div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>
  </aside>

  <div class="main">
    <div class="header">
      <div class="header-left">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle chat history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <line x1="9" y1="4" x2="9" y2="20"></line>
          </svg>
        </button>
        <div class="bot-id">
          <div class="bot-avatar">N</div>
          <div>
            <div class="bot-name" data-i18n="brand">Navigator</div>
            <div class="bot-status"><span class="status-dot"></span><span data-i18n="status">Online now</span></div>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
        <div class="lang-switch">
          <button class="lang-btn" id="langBtn">
            <span id="langLabel">English</span><span>▾</span>
          </button>
          <div class="lang-menu" id="langMenu"></div>
        </div>
      </div>
    </div>

    <div class="thread-wrap" id="thread"></div>

    <div class="composer">
      <button class="icon-btn mic-btn" id="micBtn" aria-label="Voice input" title="Speak your message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>
      <input class="composer-input" id="composerInput" type="text" data-i18n-placeholder="placeholder">
      <button class="icon-btn send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const SUN_ICON = '<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>';
const MOON_ICON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

const LANGUAGES = [
  { code:'en', native:'English',  english:'English',   speech:'en-US' },
  { code:'es', native:'Español',  english:'Spanish',   speech:'es-ES' },
  { code:'fr', native:'Français', english:'French',    speech:'fr-FR' },
  { code:'de', native:'Deutsch',  english:'German',    speech:'de-DE' },
  { code:'pt', native:'Português',english:'Portuguese', speech:'pt-PT' }
];

const STRINGS = {
  en: { brand:'Navigator', status:'Online now', placeholder:'Type or tap the mic…',
    greet1:'Hey there!', greet2:"I'm Navigator", greet3:'What should I call you?',
    newChat:'New chat', recents:'Recent', untitled:'New conversation',
    noVoice:'Voice input is not supported in this browser.' },
  es: { brand:'Navigator', status:'En línea', placeholder:'Escribe o toca el micrófono…',
    greet1:'¡Hola!', greet2:'Soy Navigator', greet3:'¿Cómo debería llamarte?',
    newChat:'Nuevo chat', recents:'Recientes', untitled:'Nueva conversación',
    noVoice:'La entrada de voz no es compatible con este navegador.' },
  fr: { brand:'Navigator', status:'En ligne', placeholder:'Écrivez ou touchez le micro…',
    greet1:'Bonjour !', greet2:'Je suis Navigator', greet3:'Comment dois-je vous appeler ?',
    newChat:'Nouvelle discussion', recents:'Récents', untitled:'Nouvelle conversation',
    noVoice:"La saisie vocale n'est pas prise en charge par ce navigateur." },
  de: { brand:'Navigator', status:'Online', placeholder:'Tippen oder Mikrofon nutzen…',
    greet1:'Hallo!', greet2:'Ich bin Navigator', greet3:'Wie soll ich Sie nennen?',
    newChat:'Neuer Chat', recents:'Kürzlich', untitled:'Neue Unterhaltung',
    noVoice:'Spracheingabe wird in diesem Browser nicht unterstützt.' },
  pt: { brand:'Navigator', status:'Online agora', placeholder:'Digite ou toque no microfone…',
    greet1:'Olá!', greet2:'Eu sou o Navigator', greet3:'Como devo te chamar?',
    newChat:'Nova conversa', recents:'Recentes', untitled:'Nova conversa',
    noVoice:'A entrada de voz não é compatível com este navegador.' }
};

let currentLang = 'en';
let conversations = [];
let activeId = null;
let convCounter = 0;

function makeGreetingMessages(){
  const s = STRINGS[currentLang];
  return [
    { sender:'bot', text:s.greet1 },
    { sender:'bot', text:s.greet2 },
    { sender:'bot', text:s.greet3 }
  ];
}

function createConversation(){
  convCounter += 1;
  const conv = {
    id: 'c' + convCounter,
    title: null, // set once the user sends a first message
    messages: makeGreetingMessages()
  };
  conversations.unshift(conv);
  activeId = conv.id;
  return conv;
}

function getActiveConversation(){
  return conversations.find(c => c.id === activeId);
}

function renderSidebar(){
  const list = document.getElementById('chatList');
  const s = STRINGS[currentLang];
  if(conversations.length === 0){
    list.innerHTML = `<div class="sidebar-empty">No conversations yet this session.</div>`;
    return;
  }
  list.innerHTML = '';
  conversations.forEach(conv=>{
    const item = document.createElement('div');
    item.className = 'chat-item' + (conv.id === activeId ? ' active' : '');
    const lastMsg = conv.messages[conv.messages.length - 1];
    const title = conv.title || s.untitled;
    const preview = lastMsg ? lastMsg.text : '';
    item.innerHTML = `<div class="chat-item-title"></div><div class="chat-item-preview"></div>`;
    item.querySelector('.chat-item-title').textContent = title;
    item.querySelector('.chat-item-preview').textContent = preview;
    item.addEventListener('click', ()=>{
      activeId = conv.id;
      renderSidebar();
      renderThread();
      if(window.innerWidth <= 768) closeMobileSidebar();
    });
    list.appendChild(item);
  });
}

function renderThread(){
  const conv = getActiveConversation();
  const thread = document.getElementById('thread');
  if(!conv){ thread.innerHTML = ''; return; }
  thread.innerHTML = '';
  conv.messages.forEach(msg=>{
    const row = document.createElement('div');
    row.className = 'row ' + (msg.sender === 'bot' ? 'left' : 'right');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (msg.sender === 'bot' ? 'bubble-bot' : 'bubble-user');
    bubble.textContent = msg.text;
    row.appendChild(bubble);
    thread.appendChild(row);
  });
  thread.scrollTop = thread.scrollHeight;
}

function renderLangMenu(){
  const menu = document.getElementById('langMenu');
  menu.innerHTML = '';
  LANGUAGES.forEach(l=>{
    const opt = document.createElement('div');
    opt.className = 'lang-option' + (l.code===currentLang ? ' active':'');
    opt.innerHTML = `<span>${l.native}</span><small>${l.english}</small>`;
    opt.addEventListener('click', ()=>{
      currentLang = l.code;
      applyLanguage();
      document.getElementById('langMenu').classList.remove('open');
    });
    menu.appendChild(opt);
  });
}

function applyLanguage(){
  const s = STRINGS[currentLang];
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(s[key]) el.textContent = s[key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const key = el.getAttribute('data-i18n-placeholder');
    if(s[key]) el.placeholder = s[key];
  });
  document.getElementById('langLabel').textContent =
    LANGUAGES.find(l=>l.code===currentLang).native;
  renderLangMenu();
  renderSidebar();
}

document.getElementById('langBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  document.getElementById('langMenu').classList.toggle('open');
});
document.addEventListener('click', ()=>{
  document.getElementById('langMenu').classList.remove('open');
});

function sendMessage(text){
  text = text.trim();
  if(!text) return;
  const conv = getActiveConversation();
  if(!conv) return;
  conv.messages.push({ sender:'user', text });
  if(!conv.title){
    conv.title = text.length > 34 ? text.slice(0,34) + '…' : text;
  }
  renderThread();
  renderSidebar();
}

document.getElementById('sendBtn').addEventListener('click', ()=>{
  const input = document.getElementById('composerInput');
  sendMessage(input.value);
  input.value = '';
});
document.getElementById('composerInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){
    e.preventDefault();
    document.getElementById('sendBtn').click();
  }
});

document.getElementById('newChatBtn').addEventListener('click', ()=>{
  createConversation();
  renderSidebar();
  renderThread();
  if(window.innerWidth <= 768) closeMobileSidebar();
});

/* --- sidebar toggle (desktop collapse / mobile drawer) --- */
const sidebar = document.getElementById('sidebar');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
const MIN_SIDEBAR_WIDTH = 200;
const MAX_SIDEBAR_WIDTH = 440;
let lastSidebarWidth = 272;

function setSidebarWidth(px){
  lastSidebarWidth = px;
  sidebar.style.setProperty('--sidebar-width', px + 'px');
}

function openMobileSidebar(){
  sidebar.classList.add('mobile-open');
  sidebarBackdrop.classList.add('show');
}
function closeMobileSidebar(){
  sidebar.classList.remove('mobile-open');
  sidebarBackdrop.classList.remove('show');
}

document.getElementById('sidebarToggle').addEventListener('click', ()=>{
  if(window.innerWidth <= 768){
    if(sidebar.classList.contains('mobile-open')) closeMobileSidebar();
    else openMobileSidebar();
  } else {
    const collapsing = !sidebar.classList.contains('collapsed');
    if(collapsing){
      sidebar.classList.add('collapsed');
    } else {
      sidebar.classList.remove('collapsed');
      setSidebarWidth(lastSidebarWidth);
    }
  }
});
sidebarBackdrop.addEventListener('click', closeMobileSidebar);

/* --- drag to resize sidebar --- */
const resizeHandle = document.getElementById('sidebarResizeHandle');
let isResizing = false;

function startResize(clientX){
  if(window.innerWidth <= 768 || sidebar.classList.contains('collapsed')) return;
  isResizing = true;
  sidebar.classList.add('resizing');
  resizeHandle.classList.add('dragging');
  document.body.style.userSelect = 'none';
}
function moveResize(clientX){
  if(!isResizing) return;
  const newWidth = Math.max(MIN_SIDEBAR_WIDTH, Math.min(MAX_SIDEBAR_WIDTH, clientX));
  setSidebarWidth(newWidth);
}
function endResize(){
  if(!isResizing) return;
  isResizing = false;
  sidebar.classList.remove('resizing');
  resizeHandle.classList.remove('dragging');
  document.body.style.userSelect = '';
}

resizeHandle.addEventListener('mousedown', (e)=>{ startResize(e.clientX); });
window.addEventListener('mousemove', (e)=>{ moveResize(e.clientX); });
window.addEventListener('mouseup', endResize);

resizeHandle.addEventListener('touchstart', (e)=>{ startResize(e.touches[0].clientX); }, {passive:true});
window.addEventListener('touchmove', (e)=>{ if(isResizing) moveResize(e.touches[0].clientX); }, {passive:true});
window.addEventListener('touchend', endResize);

/* --- theme toggle --- */
const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');

function applyThemeIcon(){
  const theme = document.documentElement.getAttribute('data-theme');
  themeIcon.innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON;
}

const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
applyThemeIcon();

themeBtn.addEventListener('click', ()=>{
  const current = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
  applyThemeIcon();
});

/* --- voice input --- */
const micBtn = document.getElementById('micBtn');
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onresult = (event)=>{
    let transcript = '';
    for(let i=0; i<event.results.length; i++){
      transcript += event.results[i][0].transcript;
    }
    document.getElementById('composerInput').value = transcript;
  };
  recognition.onend = ()=>{
    listening = false;
    micBtn.classList.remove('listening');
  };
  recognition.onerror = ()=>{
    listening = false;
    micBtn.classList.remove('listening');
  };
}

micBtn.addEventListener('click', ()=>{
  if(!SpeechRecognitionAPI){
    alert(STRINGS[currentLang].noVoice);
    return;
  }
  if(listening){
    recognition.stop();
    listening = false;
    micBtn.classList.remove('listening');
    return;
  }
  recognition.lang = LANGUAGES.find(l=>l.code===currentLang).speech;
  recognition.start();
  listening = true;
  micBtn.classList.add('listening');
});

/* --- init --- */
createConversation();
renderLangMenu();
applyLanguage();
renderThread();
</script>

</body>
</html>
